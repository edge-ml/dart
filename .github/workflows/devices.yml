name: Device tests

# Runs example/integration_test/device_test.dart on an iOS simulator, an Android
# emulator and Chrome: the example app starts, and a model exported by the
# edge-ml server runs on each platform's ExecuTorch runtime with the same
# results as PyTorch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - working-directory: example
        run: flutter pub get
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: example
          script: flutter test integration_test/device_test.dart -d emulator-5554

  # Pinned to the setup of the last passing run (2026-10-15) instead of
  # macos-latest / the newest stable Flutter / whichever iPhone is listed
  # first, so a runner image or SDK update can't silently change the run.
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SIMULATOR: iPhone 17 Pro
      SIMULATOR_OS: iOS 26.5
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: brew install ninja
      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, os, sys
          d = json.load(sys.stdin)['devices']
          want = os.environ['SIMULATOR_OS'].replace(' ', '-').replace('.', '-')
          print(next(x['udid'] for r, ds in d.items() if r.endswith(want) for x in ds if x['name'] == os.environ['SIMULATOR']))
          ")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - working-directory: example
        run: flutter pub get
      # fail a hang after 25 min instead of using up the whole job
      - working-directory: example
        timeout-minutes: 25
        run: flutter test integration_test/device_test.dart -d "$UDID"

  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # the runner image ships Chrome with a matching ChromeDriver ($CHROMEWEBDRIVER);
      # installing another Chrome makes flutter drive pair mismatched versions
      - working-directory: example
        run: |
          flutter pub get
          dart run executorch_flutter:setup_web
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
          flutter drive --driver=test_driver/integration_test.dart \
            --target=integration_test/device_test.dart \
            -d web-server --browser-name=chrome
