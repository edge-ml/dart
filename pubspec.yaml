name: edge_ml_dart
description: >-
  Flutter library for edge-ml: upload labeled sensor datasets, train models on
  the edge-ml server from presets and run them on-device with ExecuTorch.
version: 1.0.1
homepage: https://edge-ml.org
repository: https://github.com/edge-ml/dart
issue_tracker: https://github.com/edge-ml/edge-ml/issues
topics:
  - machine-learning
  - sensors
  - executorch
  - edge-ml

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  executorch_flutter: ^0.8.0
  http: ^1.3.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
