name: edge_ml_example
description: "edge_ml_dart example: record motion sensors, train a preset, predict on the device."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sensors_plus: ^7.1.1
  shared_preferences: ^2.5.6
  edge_ml_dart:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # model exported by the edge-ml server, used by integration_test/device_test.dart
    - integration_test/fixtures/torch_cnn/
